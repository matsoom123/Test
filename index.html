<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>Finance Tracker</h1>
    <div class="header-actions">
      <button id="exportBtn" class="btn btn-ghost">Export CSV</button>
      <label class="btn btn-ghost" for="importInput">Import CSV</label>
      <input type="file" id="importInput" accept=".csv" hidden>
    </div>
  </header>

  <section class="summary-cards">
    <div class="card">
      <span class="card-label">Balance</span>
      <span class="card-value" id="balanceValue">$0.00</span>
    </div>
    <div class="card income">
      <span class="card-label">Income</span>
      <span class="card-value" id="incomeValue">$0.00</span>
    </div>
    <div class="card expense">
      <span class="card-label">Expenses</span>
      <span class="card-value" id="expenseValue">$0.00</span>
    </div>
  </section>

  <main class="main-grid">
    <section class="panel">
      <h2>Add Transaction</h2>
      <form id="txForm" class="tx-form">
        <div class="form-row">
          <label>
            Type
            <select id="txType" required>
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </label>
          <label>
            Amount
            <input type="number" id="txAmount" step="0.01" min="0.01" placeholder="0.00" required>
          </label>
        </div>
        <div class="form-row">
          <label>
            Category
            <select id="txCategory" required></select>
          </label>
          <label>
            Date
            <input type="date" id="txDate" required>
          </label>
        </div>
        <label>
          Description
          <input type="text" id="txDescription" placeholder="e.g. Groceries at Trader Joe's">
        </label>
        <button type="submit" class="btn btn-primary">Add Transaction</button>
      </form>

      <h2 class="section-spacer">Monthly Budgets</h2>
      <div id="budgetList" class="budget-list"></div>
      <form id="budgetForm" class="budget-form">
        <select id="budgetCategory" required></select>
        <input type="number" id="budgetAmount" step="0.01" min="0" placeholder="Budget amount">
        <button type="submit" class="btn btn-secondary">Set Budget</button>
      </form>
    </section>

    <section class="panel">
      <h2>Spending by Category</h2>
      <div id="categoryChart" class="chart-wrap"></div>
    </section>
  </main>

  <section class="panel">
    <div class="tx-list-header">
      <h2>Transactions</h2>
      <div class="filters">
        <select id="filterCategory">
          <option value="">All Categories</option>
        </select>
        <select id="filterType">
          <option value="">All Types</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
        <input type="month" id="filterMonth">
        <button id="clearFilters" class="btn btn-ghost">Clear</button>
      </div>
    </div>
    <div class="table-wrap">
      <table id="txTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Category</th>
            <th>Type</th>
            <th class="amount-col">Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="txTableBody"></tbody>
      </table>
      <p id="emptyState" class="empty-state" hidden>No transactions yet. Add one above to get started.</p>
    </div>
  </section>
</div>
<script src="js/app.js"></script>
</body>
</html>
